server:
  port: 8080

spring:
  application:
    name: car-maintenance
  datasource:
    url: jdbc:mysql://localhost:3306/car_maintenance?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ab123168
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt
      logic-delete-value: "NOW()"
      logic-not-delete-value: "NULL"

jwt:
  secret: CarMaintenancePlatformSecretKey2025VeryLongSecretForSecurity
  expiration: 86400000

logging:
  level:
    com.carmaintenance: debug
